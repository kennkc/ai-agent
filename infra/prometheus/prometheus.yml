global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:8080"] }]
  - job_name: session-manager
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:8081"] }]
  - job_name: sense-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:8082"] }]
  - job_name: body-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:8083"] }]
  - job_name: tool-executor
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:8084"] }]
  - job_name: collab-bus
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:8085"] }]
  - job_name: nlp-service
    metrics_path: /metrics
    static_configs: [{ targets: ["host.docker.internal:8000"] }]
  - job_name: wp-bff
    metrics_path: /metrics
    static_configs: [{ targets: ["host.docker.internal:8090"] }]