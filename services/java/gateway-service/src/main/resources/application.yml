server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        ip: 127.0.0.1
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 会话管理服务路由
        - id: session-manager
          uri: lb://session-manager
          predicates:
            - Path=/api/session/**
        # 感官采集服务路由
        - id: sense-service
          uri: lb://sense-service
          predicates:
            - Path=/api/sense/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  # R1-06 链路追踪：OTLP 导出至 Jaeger
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    com.agent: INFO
