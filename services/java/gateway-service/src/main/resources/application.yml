server:
  port: 8080

app:
  auth:
    secret: ${JWT_SECRET:}
    token-ttl: PT24H
    dev-token-endpoint-enabled: ${DEV_TOKEN_ENDPOINT_ENABLED:false}

grpc:
  port: ${GRPC_PORT:9091}

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: work-platform-bff
          uri: ${WP_BFF_URI:http://127.0.0.1:8090}
          predicates:
            - Path=/api/wp/**
        - id: session-manager
          uri: lb://session-manager
          predicates:
            - Path=/api/session/**
        - id: sense-service
          uri: lb://sense-service
          predicates:
            - Path=/api/sense/**
        - id: nlp-service
          uri: lb://nlp-service
          predicates:
            - Path=/api/nlp/**
        - id: body-service
          uri: lb://body-service
          predicates:
            - Path=/api/body/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    com.agent: INFO
