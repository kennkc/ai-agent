server:
  port: 8081

app:
  nlp:
    base-url: ${NLP_BASE_URL:http://127.0.0.1:8000}
  body:
    base-url: ${BODY_BASE_URL:http://127.0.0.1:8083}

grpc:
  port: ${GRPC_PORT:9092}

spring:
  application:
    name: session-manager
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    com.agent: INFO
