server:
  port: 8081

app:
  nlp:
    base-url: ${NLP_BASE_URL:http://127.0.0.1:8000}
    # true：意图识别不可用时降级为 FALLBACK（问答仍返回模板回答）；false：直接返回 502 上游不可用
    degrade-on-failure: ${NLP_DEGRADE_ON_FAILURE:true}
  body:
    base-url: ${BODY_BASE_URL:http://127.0.0.1:8083}
    degrade-on-failure: ${BODY_DEGRADE_ON_FAILURE:true}
  # Phase 4 大脑层（R4-06）：规划→检索→生成→来源标注
  brain:
    degrade-on-failure: ${BRAIN_DEGRADE_ON_FAILURE:true}

grpc:
  port: ${GRPC_PORT:9092}

spring:
  application:
    name: session-manager
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    com.agent: INFO
