# AI Agent 生命体 - GitLab CI 骨架 (R0-08)
# Phase 0: 编译 + 单测 + 镜像构建

stages:
  - build
  - test
  - package

variables:
  PYTHONIOENCODING: "utf-8"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  paths:
    - .m2/repository/

# ── 阶段1: 构建 ──
java-build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd services/java
    - mvn clean compile -q
  artifacts:
    paths:
      - services/java/**/target/*.jar
    expire_in: 1 week

python-lint:
  stage: build
  image: python:3.12-slim
  script:
    # 版本固定：ruff 默认规则集随版本变化，不固定会让 CI 结论与本地漂移
    # （2026-09-20 实测：未固定版本的 job 从未拦住过任何问题）
    # 固定值统一放在 services/python/nlp-service/requirements-dev.txt，
    # 与 GitHub Actions 的 python-check job、本地 venv 共用同一来源。
    - pip install -r services/python/nlp-service/requirements-dev.txt
    - cd services/python
    - ruff check .

frontend-build:
  stage: build
  image: node:20
  cache:
    key: frontend-work-platform
    paths:
      - web/work-platform/node_modules/
  script:
    - cd web/work-platform
    - npm ci
    - npm run typecheck
    - npm run build
  artifacts:
    paths:
      - web/work-platform/dist/
    expire_in: 1 week

# ── 阶段2: 测试 ──
java-test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd services/java
    - mvn test -q
  coverage: '/Total.*?([0-9]{1,3})%/'

python-test:
  stage: test
  image: python:3.12-slim
  script:
    - cd services/python/nlp-service
    - pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
    - python -m pytest -q

wp-bff-test:
  stage: test
  image: node:20
  script:
    - cd services/node/wp-bff
    - node --check server.js
    - node --test

docker-smoke:
  stage: test
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker compose up -d
    - ./scripts/healthcheck.sh
  after_script:
    - docker compose logs --tail=80 || true
    - docker compose down -v || true
  # 需要 dind runner 支持；暂设为允许失败，达标后转为强制门禁
  allow_failure: true
  only:
    - main
    - dev

contract-check:
  stage: test
  image: python:3.12-slim
  script:
    - python scripts/contract-check.py
    - python scripts/contract-check.py --work-platform --openapi contracts/work-platform-bff-openapi.yaml

# ── 契约生成物同步门禁（技术债台账 §6-5 / §6-6）──
# 抓「proto/*.proto 改了，却忘了重新生成 / 提交产物」—— 此前没有任何检查能发现。
# 两侧拆成独立 job，失败时定位明确：
#   python 侧 → 产物能否由当前契约源重现、且能被 Python 加载
#   java   侧 → target 重新生成物与 src/main/java 入库产物是否逐字节一致
proto-check-python:
  stage: test
  image: python:3.12-slim
  script:
    # grpcio-tools 在 requirements-dev.txt（构建期依赖，运行时不需要）
    - pip install --no-cache-dir -r services/python/nlp-service/requirements-dev.txt
    - bash scripts/proto-sync-check.sh python

proto-check-java:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  cache:
    key: maven-proto-contracts
    paths:
      - .m2/repository/
  script:
    - cd services/java
    - mvn -Pproto-gen -pl proto-contracts -am generate-sources
    - cd "$CI_PROJECT_DIR"
    - bash scripts/proto-sync-check.sh java
  # 需联网下载 protoc 与 protoc-gen-grpc-java（版本已锁定在 proto-contracts/pom.xml，
  # 因此生成结果可复现）。若 runner 无外网导致下载失败，请改用离线仓库，
  # 或在依赖就绪前临时加 allow_failure: true（勿长期放宽）。

# ── 阶段3: 打包 ──
java-package:
  stage: package
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd services/java
    - mvn package -DskipTests -q
  artifacts:
    paths:
      - services/java/**/target/*.jar
    expire_in: 1 week

python-package:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t registry.example.com/agent/nlp-service:latest services/python/nlp-service/
    - echo "镜像构建完成 (推送逻辑 Phase 7 完善)"
  only:
    - main

