# AI Agent 生命体 - GitLab CI 骨架 (R0-08)
# Phase 0: 编译 + 单测 + 镜像构建

stages:
  - build
  - test
  - package

variables:
  PYTHONIOENCODING: "utf-8"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  paths:
    - .m2/repository/

# ── 阶段1: 构建 ──
java-build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd services/java
    - mvn clean compile -q
  artifacts:
    paths:
      - services/java/**/target/*.jar
    expire_in: 1 week

python-lint:
  stage: build
  image: python:3.12-slim
  script:
    - pip install ruff
    - cd services/python
    - ruff check .

frontend-build:
  stage: build
  image: node:20
  cache:
    key: frontend-work-platform
    paths:
      - web/work-platform/node_modules/
  script:
    - cd web/work-platform
    - npm ci
    - npm run typecheck
    - npm run build
  artifacts:
    paths:
      - web/work-platform/dist/
    expire_in: 1 week

# ── 阶段2: 测试 ──
java-test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd services/java
    - mvn test -q
  coverage: '/Total.*?([0-9]{1,3})%/'

contract-check:
  stage: test
  image: python:3.12-slim
  script:
    - python scripts/contract-check.py
    - python scripts/contract-check.py --work-platform --openapi contracts/work-platform-bff-openapi.yaml

# ── 阶段3: 打包 ──
java-package:
  stage: package
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd services/java
    - mvn package -DskipTests -q
  artifacts:
    paths:
      - services/java/**/target/*.jar
    expire_in: 1 week

python-package:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t registry.example.com/agent/nlp-service:latest services/python/nlp-service/
    - echo "镜像构建完成 (推送逻辑 Phase 7 完善)"
  only:
    - main

