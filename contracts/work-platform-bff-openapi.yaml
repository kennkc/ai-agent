  /models:
    x-wp-status: implemented
    get:
      summary: 多模型配置与运行状态（WB-10）
      description: >
        按**功能角色**（intent/embed/rerank/generate/plan/code）分组的模型接入配置清单。
        唯一真相源是 nlp-service 的 `llm_model_config` 表；BFF 只做代理，不落第二份配置。
        密钥**只以脱敏形式**出现（`api_key_hint`，形如 `sk-***last4`）——
        明文与密文都不得出现在任何响应中。
        大脑层不可达时返回 200 + `available:false`（如实降级），不返回空数组冒充"没有配置"。
      parameters:
        - name: X-Tenant-Id
          in: header
          required: false
          schema: { type: string, default: default }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [available]
                    properties:
                      available: { type: boolean }
                      tenant_id: { type: string }
                      items:
                        type: array
                        description: 配置条目（密钥为 api_key_hint 脱敏值）
                        items: { $ref: '#/components/schemas/ModelConfig' }
                      by_role:
                        type: object
                        description: 按功能角色分组的配置条目（key = 角色）
                        additionalProperties: { type: array, items: { $ref: '#/components/schemas/ModelConfig' } }
                      total: { type: integer }
                      enabled: { type: integer }
                      roles: { type: array, items: { type: object } }
                      providers: { type: array, items: { type: object } }
                      storage: { type: object, description: 存储后端与主密钥来源（含降级原因） }
                      llm:
                        type: object
                        description: 当前**实际装配**的角色引擎（与配置可能不同步，reload 后一致）
                        properties:
                          role_configured: { type: array, items: { type: string } }
                          engines: { type: object, additionalProperties: true }
                      reason: { type: string, description: available=false 时的原因 }
    post:
      summary: 新建模型接入配置（WB-10 写路径）
      description: >
        **写路径，需来源白名单 + 控制令牌**（与 `/knowledge` POST、`/middleware/{key}/start` 同级）。
        创建后立即重载角色引擎，返回体含 `reload` 摘要 —— 否则"前台配好了但不生效"，
        排障方向会被误导到模型侧，而真正原因是没重载。
      parameters:
        - name: X-Tenant-Id
          in: header
          required: false
          schema: { type: string, default: default }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelConfigUpsert' }
      responses:
        '200': { description: "OK（返回 item 与 reload 摘要）" }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /models/usage:
    x-wp-status: implemented
    get:
      summary: 模型用量看板数据源（WB-10 计量口径）
      description: >
        按**功能角色 / 模型 / token 来源**聚合的用量统计，供前台"模型用量"卡片与看板使用。
        与 `GET /models` 同为**免令牌读路径** —— 它读的是**计量结果**而非配置，故不涉及写边界。
        `days` 为统计窗口天数，越界值由 BFF 收敛到 `[1, 90]`，**不把非法值转给上游**。
        降级口径与 `GET /models` 一致：大脑层不可达时返回 200 + `available:false`，
        不把读不到渲染成"零用量"（否则看板会把上一次的数字留在页面上继续冒充当前值）。
      parameters:
        - name: days
          in: query
          required: false
          description: 统计窗口天数（BFF 收敛到 [1,90]，默认 7）
          schema: { type: integer, default: 7, minimum: 1, maximum: 90 }
        - name: X-Tenant-Id
          in: header
          required: false
          schema: { type: string, default: default }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [available]
                    properties:
                      available: { type: boolean }
                      tenant_id: { type: string }
                      window:
                        type: object
                        properties:
                          days: { type: integer }
                      totals: { type: object, description: 窗口内总量（调用数 / token / 成本） }
                      by_role: { type: object, description: 按功能角色聚合, additionalProperties: true }
                      by_model: { type: object, description: 按模型配置聚合, additionalProperties: true }
                      by_token_source: { type: object, description: 按 token 来源（真实/估算）聚合, additionalProperties: true }
                      daily: { type: array, items: { type: object }, description: 按日序列 }
                      reason: { type: string, description: available=false 时的原因 }
  /models/reload:
    x-wp-status: implemented
    post:
      summary: 重载模型角色引擎（不重启进程）
      description: >
        **写路径，需来源白名单 + 控制令牌。** 把库中配置重新装配成角色引擎，
