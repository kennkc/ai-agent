        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /models/{model_id}:
    x-wp-status: implemented
    patch:
      summary: 局部更新模型配置（WB-10 写路径）
      description: >
        **写路径，需来源白名单 + 控制令牌。** 局部更新语义由上游实现：只处理请求里
        **显式出现**的字段。BFF 只转发、不补齐默认值 —— 若在此补默认值，
        前端"只改一个开关"的请求会顺手清空 base_url / model。
        `api_key` 省略 = 保留原凭据；空串 = 清空。
      parameters:
        - { name: model_id, in: path, required: true, schema: { type: string }, description: 配置 ID（整数） }
        - name: X-Tenant-Id
          in: header
          required: false
          schema: { type: string, default: default }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelConfigUpsert' }
      responses:
        '200': { description: "OK（返回 item 与 reload 摘要）" }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
    delete:
      summary: 删除模型配置（WB-10 写路径）
      description: '**写路径，需来源白名单 + 控制令牌。** 删除后立即重载角色引擎。'
      parameters:
        - { name: model_id, in: path, required: true, schema: { type: string }, description: 配置 ID（整数） }
