openapi: 3.0.3
info:
  title: Work Platform BFF API Contract (Agent-Lifeform)
  version: 1.0.0
  description: >
    工作平台（统一工作台）BFF 接口契约（W2 扩展）。
    覆盖 14 模块：总览/生命体征/决策沙盘/五感/进化/协作总线/任务/对话/专家/技能/连接器/自动化/灵感/审批。
    Mock 数据必须与该契约结构完全一致 → 切换零 UI 改动（R-C09 延续）。
    设计依据：《工作平台功能设计文档》v1.0 §6。

    **统一错误信封（2026-09-18 起全平台一致）**：所有错误响应均为
    `{code, message, details}`，与 gateway-service、Java 三服务、nlp-service 完全同构；
    BFF 路由层分流：路径不存在 → 404 `AGENT_NOT_FOUND`，路径存在但方法不支持 →
    405 `AGENT_METHOD_NOT_ALLOWED`（附 `Allow` 头），请求体非法 → 400 `AGENT_BAD_REQUEST`，
    鉴权失败 → 401 `AGENT_UNAUTHORIZED` / 403 `AGENT_FORBIDDEN`。
    区分 404 与 5xx 是前端降级判定的前提（404 = 端点未实现 = planned）。
    完整异常传播链见 `docs/异常流程归纳.md` §2。
servers:
  - url: /api/wp
    description: Work Platform BFF 聚合层
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    X-Tenant-Id:
      schema: { type: string }
      description: 租户标识（P7 后强制）
  responses:
    ErrorEnvelope:
      description: 统一错误响应（`{code, message, details}`）—— 见 info.description
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ApiResponse:
      type: object
      required: [code, data, msg]
      properties:
        code: { type: integer, example: 0 }
        data: { type: object }
        msg: { type: string, example: ok }
    ErrorEnvelope:
      type: object
      description: |
        全平台统一错误信封。2026-09-18 起 BFF（原 `{error}`）与 nlp-service
        （原 FastAPI 默认 `{detail}`）已对齐到本结构，客户端只需一套解析逻辑。
      required: [code, message, details]
      properties:
        code:
          type: string
          description: 统一错误码（R1-08）
          enum:
            - AGENT_BAD_REQUEST
            - AGENT_UNAUTHORIZED
            - AGENT_FORBIDDEN
            - AGENT_NOT_FOUND
            - AGENT_METHOD_NOT_ALLOWED
            - AGENT_CONFLICT
            - AGENT_DUPLICATE
            - AGENT_TIMEOUT
            - AGENT_BUS_UNAVAILABLE
            - AGENT_UPSTREAM_UNAVAILABLE
            - AGENT_INTERNAL_ERROR
            # Phase 5 四肢期：工具域专属码（tool-executor `ErrorCode` 同源副本）
            # 「被拒 ≠ 服务不可用」：前四个码都是**已落审计的真实调用结果**，
            # 出现在 200 + success:false 的执行响应里，而不是 5xx。
            - AGENT_TOOL_NOT_ALLOWED
            - AGENT_TOOL_ARGS_INVALID
            - AGENT_TOOL_ARGS_BLOCKED
            - AGENT_TOOL_EXEC_FAILED
            - AGENT_TOOL_CIRCUIT_OPEN
            - AGENT_SANDBOX_REJECTED
          example: AGENT_NOT_FOUND
        message: { type: string, example: 接口不存在：/api/wp/not-exist }
        details:
          type: object
          description: 上下文明细（字段级原因 / method+supported / path 等）
          additionalProperties: true
          example: { path: /api/wp/not-exist }
    TaskState:
      type: string
      enum: [pending, running, done, failed, archived]
    Task:
      type: object
      required: [task_id, title, type, state, progress, priority]
      properties:
        task_id: { type: string, example: T-1042 }
        title: { type: string, example: 金融竞品调研报告 }
        type: { type: string, example: expert_team }
        state: { $ref: '#/components/schemas/TaskState' }
        progress: { type: integer, example: 62 }
        agent: { type: string, example: 团长+5专家 }
        priority: { type: string, enum: [P0, P1, P2] }
        created_at: { type: integer, format: int64, example: 1786462920000 }
    ExpertProfile:
      type: object
      required: [expert_id, name, domain, persona, tool_whitelist, state]
      properties:
        expert_id: { type: string, example: E-01 }
        name: { type: string, example: 行业研究员 }
        domain: { type: string, example: 信息调研 }
        persona: { type: string }
        methodology: { type: string }
        tool_whitelist: { type: array, items: { type: string } }
        output_schema: { type: object }
        state: { type: string, enum: [active, deprecated, suspended] }
    Skill:
      type: object
      required: [skill_id, name, category, version, state]
      properties:
        skill_id: { type: string, example: S-101 }
        name: { type: string, example: 深度调研 }
        category: { type: string }
        version: { type: string, example: 2.1.0 }
        installs: { type: integer, example: 128 }
        rating: { type: number, example: 4.8 }
        state: { type: string, enum: [installed, available] }
    Connector:
      type: object
      required: [connector_id, name, protocol, state]
      properties:
        connector_id: { type: string, example: C-01 }
        name: { type: string, example: 腾讯文档 }
        protocol: { type: string, example: MCP }
        use: { type: string }
        state: { type: string, enum: [online, pending_auth, offline] }
        latency: { type: integer, example: 42 }
        calls: { type: integer, example: 1260 }
    Automation:
      type: object
      required: [automation_id, auto_name, cron, state]
      properties:
        automation_id: { type: string, example: A-01 }
        auto_name: { type: string, example: 科创板行情摘要 }
        cron: { type: string, example: 0 9 * * 1-5 }
        action: { type: string }
        state: { type: string, enum: [active, paused, failed] }
        last_run: { type: string }
        next_run: { type: string }
        push: { type: array, items: { type: string } }
    Case:
      type: object
      required: [case_id, title, category]
      properties:
        case_id: { type: string, example: C-01 }
        title: { type: string, example: 行业竞品调研报告 }
        category: { type: string }
        reuse_count: { type: integer, example: 86 }
        experts: { type: array, items: { type: string } }
        skills: { type: array, items: { type: string } }
        prompt: { type: string }
        outcome: { type: string }
    Approval:
      type: object
      required: [approval_id, action, risk_level, applicant, state]
      properties:
        approval_id: { type: string, example: A-3021 }
        action: { type: string }
        risk_level: { type: string, enum: [L1, L2, L3, L4] }
        applicant: { type: string }
        context: { type: string }
        state: { type: string, enum: [pending, approved, rejected, expired] }
        target: { type: string }
        impact: { type: string }
        parameters: { type: object }
        ttl: { type: string }
        approved_by: { type: array, items: { type: string } }
        required_approvals: { type: integer, example: 2 }
        decided_by: { type: string }
        at: { type: string }
    CollaborationAgent:
      type: object
      required: [agent_id, name, role, progress, state, current_task, use_case, model, artifact_count, bus_position]
      properties:
        agent_id: { type: string, example: AG-02 }
        name: { type: string, example: 调研 Agent }
        role: { type: string, example: Researcher }
        progress: { type: number, example: 84 }
        state: { type: string, enum: [running, done, waiting, blocked] }
        current_task: { type: string }
        use_case: { type: string }
        model: { type: string }
        tools: { type: array, items: { type: string } }
        artifact_count: { type: integer }
        confidence: { type: number }
        waiting_for: { type: string }
        bus_position: { type: number }
        bus_message: { type: string }
        bus_kind: { type: string, enum: [dispatch, running, result, waiting] }
        is_leader: { type: boolean }
    CollabDomain:
      type: object
      required: [domain_id, task_id, mode, protocol, concurrency_current, concurrency_limit, agents, artifacts, gates]
      properties:
        domain_id: { type: string, example: collab-20260812-0042 }
        task_id: { type: string, example: T-1042 }
        mode: { type: string, enum: [fanout, pipeline, negotiation] }
        mode_label: { type: string, example: 扇出 Fan-out }
        protocol: { type: string, example: MC-P v1 }
        concurrency_current: { type: integer, example: 5 }
        concurrency_limit: { type: integer, example: 8 }
        p99_ms: { type: number, example: 7.8 }
        ack_rate: { type: number, example: 99.98 }
        messages_per_sec: { type: number, example: 42 }
        updated_at: { type: string }
        agents: { type: array, items: { $ref: '#/components/schemas/CollaborationAgent' } }
        msg_flow: { type: array, items: { $ref: '#/components/schemas/CollaborationMessage' } }
        artifacts: { type: array, items: { $ref: '#/components/schemas/Artifact' } }
        gates: { type: array, items: { type: object } }
    CollaborationMessage:
      type: object
      required: [message_id, time, type, from, to, text]
      properties:
        message_id: { type: string }
        time: { type: string }
        type: { type: string, enum: [dispatch, result, heartbeat, negotiate] }
        from: { type: string }
        to: { type: string }
        text: { type: string }
        payload: { type: object }
    Artifact:
      type: object
      required: [artifact_id, task_id, kind, title, conf_score]
      properties:
        artifact_id: { type: string, example: a-8810 }
        task_id: { type: string }
        kind: { type: string, enum: [document, spreadsheet, slide, image, dataset, code, report] }
        title: { type: string }
        source_agent: { type: string }
        conf_score: { type: number, example: 0.94 }
        provenance: { type: array, items: { type: string } }
        version: { type: string }
    VitalSigns:
      type: object
      required: [heart_rate, body_temp, blood_pressure, blood_oxygen, immune_index]
      properties:
        heart_rate: { type: object }
        body_temp: { type: object }
        blood_pressure: { type: object }
        blood_oxygen: { type: object }
        immune_index: { type: object }
    DecisionChain:
      type: object
      required: [decision_id, chain, confidence]
      properties:
        decision_id: { type: string, example: d-33921 }
        chain:
          type: array
          items:
            type: object
            required: [step, model, latency, confidence]
            properties:
              step: { type: string }
              model: { type: string }
              detail: { type: string }
              latency: { type: string }
              confidence: { type: number }
              io: { type: string }
        confidence: { type: number, example: 0.92 }
    EvolutionData:
      type: object
      properties:
        feedback_up: { type: integer }
        feedback_down: { type: integer }
        feedback_retry: { type: integer }
        hallucination_rate: { type: number }
        satisfaction: { type: number }
        healings:
          type: array
          items:
            type: object
            properties:
              doc: { type: string }
              action: { type: string }
              reason: { type: string }
              at: { type: string }

    OverviewWorkflowStep:
      type: object
      required: [step_id, label, state, progress]
      properties:
        step_id: { type: string }
        label: { type: string }
        state: { type: string, enum: [done, running, waiting, blocked] }
        progress: { type: number }
        owner: { type: string }
        timestamp: { type: string }
    OverviewWorkflowAgent:
      type: object
      required: [agent_id, name, state, progress]
      properties:
        agent_id: { type: string }
        name: { type: string }
        role: { type: string }
        state: { type: string, enum: [running, done, waiting] }
        progress: { type: number }
        current_task: { type: string }
        use_case: { type: string }
        model: { type: string }
    OverviewWorkflow:
      type: object
      required: [domain_id, task_title, progress, steps, agents]
      properties:
        domain_id: { type: string }
        task_title: { type: string }
        progress: { type: number }
        eta: { type: string }
        last_update: { type: string }
        execution_mode: { type: string, example: 多线并行 · fan-out }
        steps: { type: array, items: { $ref: '#/components/schemas/OverviewWorkflowStep' } }
        agents: { type: array, items: { $ref: '#/components/schemas/OverviewWorkflowAgent' } }
    ModelCallPoint:
      type: object
      required: [time, calls, tokens, latency, cost]
      properties:
        time: { type: string }
        calls: { type: number }
        tokens: { type: number }
        latency: { type: number }
        cost: { type: number }
    ModelRuntimeNode:
      type: object
      required: [node_id, name, model, state, load, queue, throughput, latency]
      properties:
        node_id: { type: string }
        name: { type: string }
        model: { type: string }
        state: { type: string, enum: [healthy, busy, degraded, offline] }
        load: { type: number }
        queue: { type: integer }
        throughput: { type: number }
        latency: { type: number }
        role: { type: string }
    OptimizationSuggestion:
      type: object
      required: [suggestion_id, title, category, priority, impact, confidence, status]
      properties:
        suggestion_id: { type: string }
        title: { type: string }
        category: { type: string, enum: [成本优化, 性能优化, 质量优化, 安全优化] }
        priority: { type: string, enum: [high, medium, low] }
        impact: { type: string }
        confidence: { type: number }
        effort: { type: string, enum: [低, 中, 高] }
        status: { type: string, enum: [pending, applied, dismissed] }
        evidence: { type: string }
        action: { type: string }
        source: { type: string }
    TodaySummaryMetric:
      type: object
      required: [label, value, trend, tone]
      properties:
        label: { type: string }
        value: { oneOf: [{ type: string }, { type: number }] }
        unit: { type: string }
        trend: { type: string }
        tone: { type: string, enum: [primary, success, warning, danger] }
    TodaySummaryEvent:
      type: object
      required: [time, title, detail, type]
      properties:
        time: { type: string }
        title: { type: string }
        detail: { type: string }
        type: { type: string, enum: [task, knowledge, model, governance] }
    TodaySummary:
      type: object
      required: [date, headline, running_index, metrics, events, attention]
      properties:
        date: { type: string }
        headline: { type: string }
        running_index: { type: integer }
        metrics: { type: array, items: { $ref: '#/components/schemas/TodaySummaryMetric' } }
        events: { type: array, items: { $ref: '#/components/schemas/TodaySummaryEvent' } }
        attention: { type: array, items: { type: string } }
    OverviewDashboard:
      type: object
      properties:
        today_summary: { $ref: '#/components/schemas/TodaySummary' }
        metrics: { type: array, items: { type: object } }
        services: { type: array, items: { type: object } }
        vitals: { type: array, items: { type: object } }
        timeline: { type: array, items: { type: object } }
        workflow: { $ref: '#/components/schemas/OverviewWorkflow' }
        model_calls: { type: array, items: { $ref: '#/components/schemas/ModelCallPoint' } }
        model_runtime: { type: array, items: { $ref: '#/components/schemas/ModelRuntimeNode' } }
        optimization_suggestions: { type: array, items: { $ref: '#/components/schemas/OptimizationSuggestion' } }
        # 2026-09-16 新增：wp-bff /overview 聚合的观测域（真实数据）
        observability:
          type: object
          properties:
            middleware:
              type: object
              properties:
                total: { type: integer }
                up: { type: integer }
                down: { type: integer }
                pending: { type: integer }
                probe_mode: { type: string, example: tcp }
                items: { type: array, items: { type: object } }
            tracing:
              type: object
              properties:
                enabled: { type: boolean }
                services: { type: integer }
                spans_sampled: { type: integer }
                recent_errors: { type: integer }
                p99_ms: { type: number }
                p99_basis: { type: string, example: sampled_recent_traces }
        # 仍未实现、由前端按降级策略显式标注的数据域
        gaps: { type: array, items: { type: string } }
        source: { type: string, example: wp-bff }
    ManagedModel:
      type: object
      required: [model_id, name, provider, tier, state, cost_per_1k, latency_ms, quality, share]
      properties:
        model_id: { type: string }
        name: { type: string }
        provider: { type: string }
        tier: { type: string, enum: [L0, L1, L2, L3] }
        state: { type: string, enum: [active, standby, degraded, disabled] }
        task_types: { type: array, items: { type: string } }
        cost_per_1k: { type: number }
        latency_ms: { type: integer }
        quality: { type: number }
        share: { type: number }
        quota: { type: string }
    # ── WB-10 模型接入配置（llm_model_config 表的对外投影）──
    #
    # 与上面的 `ManagedModel` 刻意分开：`ManagedModel` 是**运行态视图**（成本/延迟/质量/流量份额，
    # 属于观测域，当前仍为 Mock）；`ModelConfig` 是**配置真相**（接哪个供应商、哪个模型、
    # 用哪个角色的密钥）。把两者合并会让"配置改了但运行态没变"这类问题无处表达。
    ModelConfig:
      type: object
      required: [id, config_key, name, provider, base_url, model, tier, enabled]
      properties:
        id: { type: integer, description: 配置 ID }
        tenant_id: { type: string }
        config_key:
          type: string
          description: 绑定的功能角色
          enum: [intent, embed, rerank, generate, plan, code]
        role_label: { type: string, description: 角色中文名（前台展示用） }
        name: { type: string, description: 同一角色下的显示名，角色内唯一 }
        provider: { type: string, example: deepseek }
        base_url: { type: string, example: 'https://api.deepseek.com/v1' }
        model: { type: string, example: deepseek-chat }
        api_key_hint:
          type: string
          description: 脱敏后的密钥（形如 `sk-***last4`）。**明文与密文都不出接口。**
          example: sk-***mnop
        has_api_key: { type: boolean, description: 是否已配置凭据 }
        tier: { type: string, enum: [L1, L2, L3], description: 层级（参与降级链） }
        max_tokens: { type: integer, nullable: true }
        temperature: { type: number, nullable: true }
        timeout_ms: { type: integer, nullable: true }
        routing_weight: { type: integer, description: 角色内优先级（大者优先） }
        enabled: { type: boolean, description: 未启用的配置不进入角色引擎，也不参与路由 }
        extra: { type: object, additionalProperties: true }
        last_probe_at: { type: string, nullable: true }
        last_probe_ok: { type: boolean, nullable: true }
        last_probe_detail: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }
    ModelConfigUpsert:
      type: object
      description: |
        创建/局部更新的请求体。PATCH 只处理**显式出现**的字段：
        `api_key` 省略 = 保留原凭据，空串 = 清空（明文永不出现在响应中）。
      properties:
        config_key: { type: string, enum: [intent, embed, rerank, generate, plan, code] }
        name: { type: string }
        provider: { type: string, default: custom }
        base_url: { type: string }
        model: { type: string }
        api_key: { type: string, nullable: true }
        tier: { type: string, enum: [L1, L2, L3, ''] }
        max_tokens: { type: integer, nullable: true }
        temperature: { type: number, nullable: true }
        timeout_ms: { type: integer, nullable: true }
        routing_weight: { type: integer, nullable: true }
        enabled: { type: boolean, default: false }
        extra: { type: object, additionalProperties: true }
    ModelRoute:
      type: object
      required: [route_id, task_type, model_id, share]
      properties:
        route_id: { type: string }
        task_type: { type: string }
        model_id: { type: string }
        model_name: { type: string }
        share: { type: number }
        cost: { type: string }
        note: { type: string }
    RemoteChannel:
      type: object
      required: [channel_id, name, type, state]
      properties:
        channel_id: { type: string }
        name: { type: string }
        type: { type: string, enum: [wechat, wecom, feishu, dingtalk, qq] }
        state: { type: string, enum: [online, available, offline] }
        account: { type: string }
        capabilities: { type: array, items: { type: string } }
        last_message: { type: string }
    RemoteFlowEvent:
      type: object
      required: [event_id, time, direction, channel, message, status]
      properties:
        event_id: { type: string }
        time: { type: string }
        direction: { type: string, enum: [下发, 执行, 回传] }
        channel: { type: string }
        message: { type: string }
        status: { type: string, enum: [sent, running, done, failed] }
    OnlineAgent:
      type: object
      required: [agent_id, name, role, state, task]
      properties:
        agent_id: { type: string }
        name: { type: string }
        role: { type: string }
        state: { type: string, enum: [run, wait, idle] }
        task: { type: string }
        model: { type: string }
        latency_ms: { type: integer }
    KnowledgeTier:
      type: object
      required: [tier, store, available]
      properties:
        tier: { type: string, enum: [HOT, WARM, COLD] }
        store: { type: string, enum: [redis, qdrant, postgres] }
        available: { type: boolean, description: 探针结果，不可用时必须为 false（不得虚构可用） }
        detail: { type: string }
        collection: { type: string }
        vector_size: { type: integer }
        backend: { type: string }
        hit_rate: { type: number }
        hits: { type: integer }
        misses: { type: integer }
    KnowledgeStats:
      type: object
      required: [available, checked_at]
      properties:
        available: { type: boolean }
        tenant_id: { type: string }
        checked_at: { type: string }
        body_url: { type: string }
        reason: { type: string, description: available=false 时的原因说明 }
        gaps: { type: array, items: { type: string }, description: 未取到的数据域，供前端标注降级 }
        note: { type: string }
        knowledge:
          type: object
          properties:
            documents: { type: integer }
            chunks: { type: integer }
            metadata_backend: { type: string, enum: [pg, memory] }
            vector_points: { type: integer }
        retrieval:
          type: object
          description: 检索指标，口径为「最近 500 次采样」，非全量历史
          properties:
            searches: { type: integer }
            searches_with_result: { type: integer }
            search_hit_rate: { type: number, description: 有结果的检索次数 / 检索总次数 }
            cache_hits: { type: integer }
            cache_hit_rate: { type: number, description: 缓存命中次数 / 检索总次数（R3-08 验收 ≥ 0.3） }
            rerank_calls: { type: integer }
            rerank_degraded: { type: integer }
            latency_p50_ms: { type: integer }
            latency_p95_ms: { type: integer }
            latency_p99_ms: { type: integer }
            sample_size: { type: integer }
            p99_basis: { type: string, enum: [sampled_recent_searches] }
        storage:
          type: object
          properties:
            hot: { $ref: '#/components/schemas/KnowledgeTier' }
            warm: { $ref: '#/components/schemas/KnowledgeTier' }
            cold: { $ref: '#/components/schemas/KnowledgeTier' }
        embedding:
          type: object
          properties:
            backend: { type: string, description: 'bge-m3 或 hash-ngram-768（降级）' }
            dim: { type: integer }
            available: { type: boolean }
            degraded: { type: boolean }
        reranker:
          type: object
          properties:
            backend: { type: string }
            available: { type: boolean }
            degraded: { type: boolean }
        vector_store:
          type: object
          properties:
            provider: { type: string, enum: [qdrant] }
            collection: { type: string }
            available: { type: boolean }
            vector_size: { type: integer }
    KnowledgeHit:
      type: object
      required: [rank, chunk_id, doc_id, title, snippet]
      properties:
        rank: { type: integer }
        chunk_id: { type: string }
        doc_id: { type: string }
        title: { type: string }
        heading: { type: string }
        chunk_index: { type: integer }
        score: { type: number, description: 向量召回分（保留供对照） }
        rerank_score: { type: number, description: 重排分，重排降级时等于召回分 }
        source: { type: string }
        ingest_time_iso: { type: string }
        snippet: { type: string, description: 围绕首个命中词截窗的片段 }
        matched_terms: { type: array, items: { type: string }, description: 前端据此高亮 snippet }
    KnowledgeSearchResult:
      type: object
      required: [available, query, top_k, hits]
      properties:
        available: { type: boolean }
        tenant_id: { type: string }
        query: { type: string }
        top_k: { type: integer }
        parsed_terms: { type: array, items: { type: string } }
        hits: { type: array, items: { $ref: '#/components/schemas/KnowledgeHit' } }
        hit_count: { type: integer }
        latency_ms: { type: integer }
        checked_at: { type: string }
        reason: { type: string }
        highlight_note: { type: string }
    KnowledgeIngestResult:
      type: object
      required: [available, mode]
      properties:
        available: { type: boolean, description: 体层是否可用；false 时不返回任何入库结果字段 }
        mode: { type: string, enum: [single, batch] }
        tenant_id: { type: string }
        checked_at: { type: string }
        latency_ms: { type: integer }
        reason: { type: string, description: available=false 时的原因（体层不可用 / 被体层拒绝） }
        error_code: { type: string, description: 被体层拒绝时的统一错误码，如 AGENT_BAD_REQUEST }
        doc_id: { type: string, description: mode=single 时的文档 ID }
        chunk_count: { type: integer }
        status: { type: string, enum: [PENDING, INDEXED, FAILED] }
        vector_backend: { type: string }
        degraded: { type: boolean }
        normalized_chars: { type: integer, description: 格式解析后的正文字数（真正参与分块的长度） }
        success: { type: boolean, description: mode=single 时体层写入是否成功 }
        total: { type: integer, description: mode=batch 时的文档总数 }
        succeeded: { type: integer }
        failed: { type: integer }
        results: { type: array, items: { type: object }, description: mode=batch 时的逐条结果 }
paths:
  /overview:
    x-wp-status: implemented
    get:
      summary: 总览聚合（已实现观测域：中间件 + 链路追踪；其余数据域经 gaps 显式透传）
      description: |
        已实现部分为真实数据：observability.middleware（8 中间件 TCP 探针）与
        observability.tracing（Jaeger 服务与采样统计）。
        其余数据域由 gaps 列出，前端据此标注为 Mock 降级，不做静默填充。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OverviewDashboard' }
        '404':
          $ref: '#/components/responses/ErrorEnvelope'
        '405':
          $ref: '#/components/responses/ErrorEnvelope'
  /knowledge:
    x-wp-status: implemented
    get:
      x-wp-security: origin-allowlist
      summary: 躯体层知识统计（知识量 / 检索 P99 / 命中率 / 三层存储）
      description: |
        代理体层 GET /api/body/knowledge/stats。body-service 未启动时返回 available=false
        并列出 gaps，前端据此标注降级——不以 0 冒充"知识量为零"。
        **读路径**：按设计免控制令牌，仅回显白名单来源的 CORS 头。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: false
          schema: { type: string, default: default }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/KnowledgeStats' }
        '404':
          $ref: '#/components/responses/ErrorEnvelope'
        '405':
          $ref: '#/components/responses/ErrorEnvelope'
    post:
      x-wp-security: origin-allowlist + control-token
      summary: 知识入库（单篇 / 批量导入）—— 工作平台侧唯一写路径
      description: |
        代理体层 POST /api/body/knowledge（单篇，请求体含 content）与
        POST /api/body/knowledge/batch（请求体含 documents 数组）。
        content 的格式由 format 字段声明（auto/md/text/html），体层在分块前做格式解析；
        pdf/docx 由体层显式拒绝并回传统一错误码（DEBT-013），BFF 原样上报而不吞错。
        体层不可用或入库被拒时返回 available=false 与 reason，绝不返回伪造的 success。

        **写路径鉴权**：同一路径的 GET 免令牌，但本 POST 会真实改动知识库，
        因此与 `/middleware/{key}/start|stop` 同级校验：来源白名单 + `X-WP-Control-Token`。
        开发环境下由 Vite 代理对 `/api/wp/*` 统一注入令牌，前端无需额外处理；
        浏览器直连 8090 将得到 401/403，不存在无鉴权写入后门。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: false
          schema: { type: string, default: default }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                doc_id: { type: string, description: 缺省时由体层生成 doc-<uuid> }
                title: { type: string }
                content: { type: string, description: 单篇入库必填（非空） }
                source: { type: string, description: 来源标识，批量模式下可作默认值 }
                format: { type: string, enum: [auto, md, markdown, text, txt, html, htm], default: auto }
                documents:
                  type: array
                  description: 批量导入时提交；与 content 二选一
                  items:
                    type: object
                    properties:
                      doc_id: { type: string }
                      title: { type: string }
                      content: { type: string }
                      source: { type: string }
                      format: { type: string }
      responses:
        '200':
          description: OK（体层不可用/被拒时同样 200，但 available=false）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/KnowledgeIngestResult' }
        '400':
          description: content 为空 / documents 为空数组 / 请求体非法或过大
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401':
          description: 控制令牌缺失或无效（X-WP-Control-Token）—— 鉴权失败时不触达体层
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: 来源不在白名单（Origin/Referer 校验失败）—— CSRF 防护
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          $ref: '#/components/responses/ErrorEnvelope'
        '405':
          $ref: '#/components/responses/ErrorEnvelope'
  /knowledge/search:
    x-wp-status: implemented
    post:
      x-wp-security: origin-allowlist
      summary: 检索测试（语义检索 + 命中片段高亮）
      description: |
        代理体层 POST /api/body/retrieve（缓存优先 → 向量召回 TOP-50 → 重排 TOP-K）。
        matched_terms 与截窗 snippet 由 BFF 计算，供前端高亮命中片段；
        体层不可用时返回 available=false，不返回伪造结果。

        **只读语义**：虽为 POST（需靠请求体传查询词），但不改动任何数据，故与
        `GET /knowledge` 一样免控制令牌——与写路径 `POST /knowledge` 的区别在此。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 1 }
                top_k: { type: integer, minimum: 1, maximum: 20, default: 5 }
                use_cache: { type: boolean, default: true, description: 是否走缓存优先策略 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/KnowledgeSearchResult' }
        '400':
          description: query 为空或请求体非法
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          $ref: '#/components/responses/ErrorEnvelope'
        '405':
          $ref: '#/components/responses/ErrorEnvelope'
  /vitals:
    x-wp-status: planned
