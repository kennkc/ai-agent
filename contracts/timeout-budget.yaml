    operation: "GET /api/tool/list（Function Calling 工具目录）"
    upstream_budget_ms: 8000
    downstream_worst_case_ms: 1000
    downstream_basis: "进程内注册表"
    upstream_anchor_file: services/python/nlp-service/app/tools/function_calling.py
