# ─────────── 系统性建议（未落地，供 P6 决策）───────────
recommendations:

  - id: REC-01
    title: "LLM 级联需要总预算上限（deadline propagation）"
    detail: "当前 max_retries=1 且逐级放宽超时（L1 3s -> L2 8s -> L3 20s），最坏耗时是各级超时与重试次数的乘积，随层级与重试数增长而膨胀。正确做法是给一次 generate() 调用一个总 deadline，级联只在该 deadline 内调度，这样上游预算才能可靠覆盖下游 —— 否则只能靠不断调大上游超时，而这会把「快速失败并降级」变成「长时间等待后仍降级」，损害体验且掩盖故障。"

  - id: REC-02
    title: "本表应纳入 CI 与启动自检"
    detail: "门禁脚本已可跑；后续应挂进 CI 与 start.sh 前置检查，使超时错配在提交期而非运行期暴露。"

  - id: REC-03
    title: "同语言内也应复核「上游预算 vs 下游最坏」"
    detail: "本轮只覆盖跨服务调用；单服务内的线程池等待 / 队列超时同样存在同类错配风险。"
