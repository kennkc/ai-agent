  # ── 基础设施（不同量级，豁免余量校验，仅登记）──
  - id: TB-18
    caller: wp-bff
    callee: docker
    operation: "中间件 start watchdog"
    tier: MIDDLEWARE_START
    upstream_budget_ms: 180000
    downstream_worst_case_ms: 30000
    downstream_basis: "容器启动实测 10~30s"
    upstream_anchor_file: services/node/wp-bff/server.js
    upstream_anchor_pattern: "const START_TIMEOUT_MS = (\d+)"
    upstream_anchor_scale: 1
    exempt_headroom: true
    status: ok
    note: "watchdog 语义：超时不是失败，是解除中间态的兜底，故豁免余量校验"

  - id: TB-19
    caller: wp-bff
    callee: "postgres | redis | qdrant | nacos | jaeger | kafka | nats | minio"
    operation: "TCP 健康探针"
    upstream_budget_ms: 900
    downstream_worst_case_ms: 900
    downstream_basis: "探测阈值本身即判定标准（连通即返回，不等待业务处理）"
    upstream_anchor_file: services/node/wp-bff/server.js
    upstream_anchor_pattern: "function probeTcp\(port, timeoutMs = (\d+)\)"
    upstream_anchor_scale: 1
    exempt_headroom: true
    status: ok
    note: "探针语义特殊：超时 = 判定为 down，是**预期结果**而非错误"

# ─────────── 调用点魔法数字扫描 ───────────
#
# 锚点校验（edge 上的 *_anchor_pattern）锚的是**常量定义**，看不见调用点就地写死的数字。
# 2026-09-19 实测被绕过一次：`POST /api/body/knowledge` 调用点写 `timeoutMs: 30000`
# （= 下游最坏耗时，余量 0），而表中记的是常量 60000 —— 门禁全绿，缺陷仍在。
# 故单独扫调用点：凡跨服务调用不得就地写数字，必须用 budget_tiers 命名档位。
magic_number_scan:

  - id: MNS-01
    file: services/node/wp-bff/server.js
    pattern: "timeoutMs:\s*(\d{2,})"
    note: "wp-bff 所有跨服务调用点；`httpGetJson` 的 2500 是默认**形参**而非 key，故不命中"

# ─────────── 已知缺口（倒挂未闭合）───────────
