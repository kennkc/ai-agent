name: CI

# 2026-09-20 新增：远端托管在 GitHub，而此前的流水线只写在 .gitlab-ci.yml 里，
# GitHub 侧不会执行任何门禁（这就是"门禁齐备却从未拦住问题"的根因）。
# 本 workflow 把关键门禁搬到 GitHub Actions；.gitlab-ci.yml 保留以兼容原有 GitLab 环境。

on:
  push:
    branches: [codex/main, dev, workbuddy/main]
  pull_request:
    branches: [codex/main, dev, workbuddy/main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-test:
    name: Java / mvn test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: 运行 Java 测试
        working-directory: services/java
        run: mvn -B -ntp test
      - name: proto 生成物同步校验（Java 侧）
        working-directory: services/java
        run: |
          mvn -B -ntp -Pproto-gen -pl proto-contracts -am generate-sources
          cd ../..
          bash scripts/proto-sync-check.sh java

  collab-integration:
    name: MC-01 / PG + NATS integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent123
          POSTGRES_DB: lifeform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: 启动 NATS JetStream
        run: |
          docker run --rm -d --name nats-integration \
            -p 4222:4222 -p 8222:8222 \
            nats:2.10-alpine -js -m 8222 --store_dir /data
      - name: 等待 NATS 健康
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8222/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "NATS did not become healthy" >&2
          exit 1
      - name: 运行 collab-bus 真实集成测试
        working-directory: services/java
        env:
          COLLAB_IT: 'true'
          PG_URL: jdbc:postgresql://127.0.0.1:5432/lifeform
          PG_USER: agent
          PG_PASSWORD: agent123
          NATS_URL: nats://127.0.0.1:4222
        run: mvn -B -ntp -pl collab-bus -am test
  python-check:
    name: Python / ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        working-directory: services/python/nlp-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff 静态检查（版本由 requirements-dev.txt 固定，避免规则漂移）
        working-directory: services/python
        run: ruff check .
      - name: Pytest
        working-directory: services/python/nlp-service
        run: python -m pytest -q
      - name: proto 生成物同步校验（Python 侧）
        run: bash scripts/proto-sync-check.sh python

  wp-bff-test:
    name: wp-bff / node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 控制面鉴权与代理回归
        working-directory: services/node/wp-bff
        run: node --test

  frontend-build:
    name: 前端 / typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/work-platform/package-lock.json
      - name: 构建工作平台
        working-directory: web/work-platform
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: 前端功能测试与覆盖率报告
        working-directory: web/work-platform
        run: npm run test:report
      - name: 上传前端测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: |
            web/work-platform/test-results/junit.xml
            web/work-platform/coverage/coverage-summary.json
  contract-check:
    name: 契约 / contract + timeout + proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: proto 与数据字典校验
        run: python scripts/contract-check.py
      - name: work-platform 契约分层校验
        run: python scripts/contract-check.py --work-platform --openapi contracts/work-platform-bff-openapi.yaml
      - name: 跨服务超时预算校验
        run: python scripts/timeout-budget-check.py
      # proto 生成物同步校验需要 grpcio-tools / Maven 生成步骤，
      # 因此分别落在 python-check 与 java-test 两个 job 中，此处不再重复。
  collab-bus-check:
    name: MC-01 / NATS P99 < 10ms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 启动 NATS JetStream
        run: |
          docker run --rm -d --name nats-gate \
            -p 4222:4222 -p 8222:8222 \
            nats:2.10-alpine -js -m 8222 --store_dir /data
      - name: 等待 NATS 健康
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8222/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "NATS did not become healthy" >&2
          exit 1
      - name: 安装 nats-py
        run: pip install 'nats-py>=2.9.0'
      - name: R-MC01-04 P99 门禁
        run: python scripts/collab-bus-check.py --require-jetstream
