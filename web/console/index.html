<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lifeform Console · 生命体总控台（Mock 原型）</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --border:#e3e8f0; --text:#1c2536; --text2:#64748b;
  --primary:#185fa5; --accent:#0f6e56; --warn:#a32d2d; --muted:#94a3b8;
  --brain:#185fa5; --sense:#0f6e56; --body:#7c5cbf; --limb:#c05621;
  --immune:#a32d2d; --evolve:#0f766e; --system:#5f5e5a; --chat:#334155;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh}
/* ── 顶部栏 ── */
header{background:linear-gradient(135deg,#0f2f5c,#185fa5 60%,#1d7a8a);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(15,47,92,.25)}
.logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;letter-spacing:.5px}
.logo .pulse{width:12px;height:12px;border-radius:50%;background:#4ade80;box-shadow:0 0 10px #4ade80;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.badge{margin-left:auto;display:flex;align-items:center;gap:8px}
.tag{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;letter-spacing:.5px}
.tag.mock{background:#fbbf24;color:#451a03;border:1px solid #f59e0b}
.tag.api{background:#34d399;color:#064e3b;border:1px solid #10b981}
.tag.phase{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)}
/* ── 布局 ── */
.wrap{display:flex;min-height:calc(100vh - 60px)}
/* ── 左侧导航 ── */
nav{width:210px;background:var(--panel);border-right:1px solid var(--border);padding:16px 10px;flex-shrink:0}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;cursor:pointer;margin-bottom:4px;font-size:13.5px;color:var(--text2);transition:all .2s;border:1px solid transparent;position:relative}
.nav-item:hover{background:#eef4fb;color:var(--text)}
.nav-item.active{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(24,95,165,.3)}
.nav-item .ico{font-size:16px}
.nav-item .dot{margin-left:auto;width:8px;height:8px;border-radius:50%}
.nav-item .dot.on{background:#4ade80}
.nav-item .dot.off{background:#cbd5e1}
.nav-sep{margin:12px 0;border-top:1px solid var(--border)}
.nav-hint{font-size:11px;color:var(--muted);padding:8px 12px;line-height:1.6}
/* ── 主区 ── */
main{flex:1;padding:20px 24px;overflow-y:auto}
.view-title{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.view-title h2{font-size:19px;font-weight:600}
.view-title .desc{font-size:12.5px;color:var(--text2)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;transition:box-shadow .2s}
.card:hover{box-shadow:0 6px 18px rgba(15,47,92,.08)}
.card .k{font-size:12px;color:var(--text2);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.card .v{font-size:26px;font-weight:600;line-height:1.2}
.card .s{font-size:11.5px;color:var(--text2);margin-top:4px}
.card .v.g{color:var(--accent)} .card .v.r{color:var(--warn)} .card .v.b{color:var(--primary)}
.chart-box{position:relative;height:220px}
/* ── 状态条 ── */
.status-bar{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--text2);align-items:center}
.status-bar b{color:var(--text)}
.ok{color:var(--accent)} .bad{color:var(--warn)}
/* ── 对话终端 ── */
.chat-box{display:flex;flex-direction:column;height:480px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--panel)}
.chat-head{background:#eef4fb;padding:10px 16px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#fafcff}
.msg{max-width:78%;padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.6}
.msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px}
.msg .src{display:block;font-size:11px;color:var(--text2);margin-top:6px}
.chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);background:#fff}
.chat-input input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;outline:none}
.chat-input input:focus{border-color:var(--primary)}
.chat-input button{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:0 20px;font-size:13.5px;cursor:pointer}
/* ── 表格 ── */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:8px 10px;background:#f1f5f9;color:var(--text2);font-weight:500;border-bottom:1px solid var(--border)}
td{padding:8px 10px;border-bottom:1px solid var(--border)}
.st{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:500}
.st.up{background:#dcfce7;color:#166534}.st.down{background:#fee2e2;color:#991b1b}.st.deg{background:#fef3c7;color:#92400e}
/* ── D6 五感矩阵（感官视图）── */
.sensor-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.sensor{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--muted);border-radius:12px;padding:14px;cursor:pointer;transition:all .18s}
.sensor:hover{box-shadow:0 6px 18px rgba(15,47,92,.10);transform:translateY(-2px)}
.sensor.selected{box-shadow:0 0 0 2px rgba(24,95,165,.45)}
.sensor.up{border-left-color:#16a34a}
.sensor.deg{border-left-color:#d97706;background:linear-gradient(180deg,#fffbeb,#fff)}
.sensor.down{border-left-color:#dc2626;background:linear-gradient(180deg,#fef2f2,#fff)}
.sensor .head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sensor .head .ico{font-size:18px}
.sensor .head .nm{font-size:13.5px;font-weight:600}
.sensor .head .st{margin-left:auto}
.sensor .metric{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text2);margin-top:5px}
.sensor .metric b{color:var(--text);font-weight:600}
.sensor .last{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);font-size:11px;color:var(--muted)}
.sensor-warn{margin-top:6px;font-size:11px;color:#92400e;background:#fef3c7;border-radius:6px;padding:4px 7px}
.detail-panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.detail-panel h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.detail-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--text2);margin-bottom:12px}
.detail-meta b{color:var(--text)}
.ds-note{font-size:11.5px;color:var(--text2);background:#eef4fb;border:1px solid #dbe7f5;border-radius:8px;padding:8px 12px;margin-bottom:12px}
/* 待点亮 */
.placeholder{border:2px dashed var(--border);border-radius:12px;padding:40px;text-align:center;color:var(--muted);font-size:13px}
footer{padding:16px 24px;font-size:11.5px;color:var(--muted);text-align:center;border-top:1px solid var(--border);background:var(--panel)}
@media(max-width:900px){.grid,.grid.c3,.grid.c2,.sensor-grid{grid-template-columns:repeat(2,1fr)}nav{width:64px}.nav-item span.txt{display:none}}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="pulse"></span>Lifeform Console · 生命体总控台</div>
  <div class="badge">
    <span class="tag phase">设计阶段 · 原型预览</span>
    <span class="tag mock" id="dsTag">DATA_SOURCE = MOCK</span>
  </div>
</header>

<div class="wrap">
  <nav id="nav">
    <div class="nav-item active" data-view="brain"><span class="ico">🧠</span><span class="txt">大脑视图</span><span class="dot on"></span></div>
    <div class="nav-item" data-view="sense"><span class="ico">👁️</span><span class="txt">感官视图</span><span class="dot on"></span></div>
    <div class="nav-item" data-view="body"><span class="ico">📚</span><span class="txt">躯体视图</span><span class="dot on"></span></div>
    <div class="nav-item" data-view="limb"><span class="ico">🛠️</span><span class="txt">执行视图</span><span class="dot on"></span></div>
    <div class="nav-item" data-view="immune"><span class="ico">🛡️</span><span class="txt">免疫视图</span><span class="dot on"></span></div>
    <div class="nav-item" data-view="evolve"><span class="ico">🔄</span><span class="txt">进化视图</span><span class="dot on"></span></div>
    <div class="nav-item" data-view="system"><span class="ico">⚙️</span><span class="txt">系统视图</span><span class="dot on"></span></div>
    <div class="nav-item" data-view="chat"><span class="ico">💬</span><span class="txt">交互终端</span><span class="dot on"></span></div>
    <div class="nav-sep"></div>
    <div class="nav-hint" id="navHint">Mock 先行原型：8 视图以静态测试数据展示，接口契约已定义（见设计文档 §10）。感官视图已支持 DATA_SOURCE=api 接入真实采集数据。</div>
  </nav>

  <main id="main"></main>
</div>

<footer>Agent-Lifeform · Lifeform Console · 依据《LifeformConsole-统一可视化终端设计》· 感官视图数据源：<span id="footDs">MOCK</span></footer>

<script src="js/provider.js"></script>
<script>
// ═══════════ Mock 数据（MockDataSource · 契约先行）═══════════
const MOCK = {
  brain:{ active_sessions:42, intent_dist:[{n:'知识问答',v:58},{n:'工具调用',v:22},{n:'总结报告',v:12},{n:'闲聊',v:8}], queue:['任务T-1024 汇总报告','任务T-1025 舆情采集','任务T-1026 竞品分析'], trend:[8,12,15,13,18,22,28,33,42] },
  // sense 视图数据统一由 ConsoleDataProvider 提供（js/provider.js，mock/api 同契约）
  body:{ total:128450, p99:286, hit_rate:94.3, docs:34210, ingest_rate:5.8, retrieve_trend:[310,295,288,290,286,286] },
  limb:{ tool_calls:1520, sandbox:['运行中','运行中','空闲'], success:96.8, dag_running:3, tools:[{n:'calculator',c:620,s:99.2},{n:'http',c:410,s:96.5},{n:'code',c:305,s:94.8},{n:'search',c:185,s:95.1}] },
  immune:{ events:12, circuit:['gateway:关闭','llm-gateway:半开','sense:关闭'], tenants:3, error_rate:0.42, alerts:[{t:'LLM成本激增',l:'P1',s:'已确认'},{t:'渠道降级',l:'P2',s:'处理中'}] },
  evolve:{ feedback:{up:328,down:47,retry:23}, healing_count:18, hallucination_rate:2.1, satisfaction:[88,89,90,91,91,92], heal_list:[{d:'doc-8842',a:'重采替换',t:'2026-08-08 09:12'},{d:'doc-3317',a:'人工复核',t:'2026-08-07 16:40'}] },
  system:{ services:[{n:'gateway-service',p:8080,s:'UP'},{n:'session-manager',p:8081,s:'UP'},{n:'sense-service',p:8082,s:'UP'},{n:'nlp-service',p:8000,s:'UP'},{n:'body-service',p:8083,s:'UP'},{n:'tool-executor',p:8084,s:'UP'},{n:'dag-engine',p:8085,s:'UP'}], cpu:46, mem:58, cost:1280.5, cost_trend:[980,1050,1120,1180,1230,1280.5] }
};

let charts = {};
const $ = id => document.getElementById(id);
const main = document.getElementById('main');
/** 用户输入/后端文本进 innerHTML 前一律转义，避免 XSS 与标签破坏 */
const escapeHtml = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
/** 交互终端会话号（多轮上下文标识，与 session-manager 的 session_id 对应） */
const CHAT_SESSION = 'S-' + Math.random().toString(36).slice(2, 6).toUpperCase();

// ═══════════ 视图渲染 ═══════════
function card(k,v,cls='',s=''){return `<div class="card"><div class="k">${k}</div><div class="v ${cls}">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`}
function chartCard(title,type,labels,data,color){
  return `<div class="card"><div class="k">${title}</div><div class="chart-box"><canvas id="c-${title.replace(/\s/g,'')}"></canvas></div></div>`;
}

/**
 * 大脑视图（R-C04）。
 *
 * 真实指标（LLM 路由 / 语义缓存命中率 / 检索片段数 / 模型运行时）来自
 * `ConsoleDataProvider.getBrainOverview()`（api 模式 = wp-bff `/api/wp/brain`）；
 * 后端暂无统计接口的维度（意图分布 / 会话趋势）保留演示图表，但**显式标注为演示值**，
 * 不把它们混进真实指标区。
 */
async function renderBrain(){
  const ds = window.ConsoleDataProvider.dataSource;
  let ov = null, err = null;
  try{
    ov = await window.ConsoleDataProvider.source.getBrainOverview();
  }catch(e){ err = e; }

  if (err){
    return `
    <div class="view-title"><h2>🧠 大脑视图</h2><span class="desc">会话 · 意图 · 任务规划</span></div>
    <div class="placeholder">大脑指标加载失败：${escapeHtml(err.message)}<br><br>
      排查：① wp-bff 已启动（默认 8090，可用 ?bff= 指定）② nlp-service 已启动（8000）③ ?ds=mock 回退演示数据</div>`;
  }

  const llm = ov.llm || {};
  const cache = ov.semantic_cache || {};
  const cacheStats = cache.stats || {};
  const retrieval = ov.retrieval || {};
  const engines = (llm.engines || []).map(e => `${e.name}(${e.level})`).join(' · ') || '无可用引擎';
  const llmStats = llm.stats || {};
  const runtime = ov.model_runtime || [];
  const reasons = ov.degraded_reasons || [];
  // 会话真相：/api/wp/brain 的 sessions 分片来自 session-manager；读不到时 active_sessions 为 null，
  // 此时意图分布退回演示值并显式标注（不把「读不到」画成真实分布）。
  const sessions = ov.sessions || null;
  const intentDist = sessions && sessions.available && sessions.by_intent && Object.keys(sessions.by_intent).length
    ? Object.entries(sessions.by_intent).map(([n, v]) => ({ n, v }))
    : MOCK.brain.intent_dist;
  // 图表在 renderCharts 里绘制（晚于本函数），真实分布经此变量传递，避免写死演示值
  window.__brainIntent = intentDist;

  return `
  <div class="view-title"><h2>🧠 大脑视图</h2><span class="desc">会话 · 意图 · 任务规划 · 大脑运行时</span></div>
  <div class="ds-note">数据源：<b>${ds.toUpperCase()}</b>${ds === 'api' ? `（BFF ${window.ConsoleDataProvider.bffBase}）` : '（静态演示数据）'}
    ${ov.degraded ? ' · <b style="color:var(--warn,#b45309)">降级</b>' : ''} · 采集于 ${ov.checked_at || '-'}</div>
  <div class="grid">
    ${card('LLM 路由', llm.available ? '可用' : '不可用', llm.available ? 'g' : 'r', `引擎：${engines}`)}
    ${card('LLM 调用次数', llmStats.calls != null ? llmStats.calls : '-','','完成 Token：' + (llmStats.completion_tokens != null ? llmStats.completion_tokens : '-'))}
    ${card('语义缓存命中率', cacheStats.hit_rate != null ? (cacheStats.hit_rate * 100).toFixed(1) + '%' : '-', (cacheStats.hit_rate || 0) >= 0.2 ? 'g' : 'r', `后端：${cache.backend || '-'} · 命中 ${cacheStats.hits != null ? cacheStats.hits : '-'}/${cacheStats.lookups != null ? cacheStats.lookups : '-'}`)}
    ${card('知识片段数', retrieval.chunks != null ? retrieval.chunks : '-','',`检索后端：${retrieval.backend || '-'}`)}
    ${card('活跃会话', sessions && sessions.available && sessions.active_sessions != null ? sessions.active_sessions : '-',
      sessions && sessions.available ? 'g' : 'r',
      sessions && sessions.available ? 'session-manager Redis 实时汇总' : escapeHtml((sessions && sessions.reason) || '会话真相不可读'))}
  </div>
  <div class="grid c2">
    <div class="card"><div class="k">模型运行时（R-C04）</div><table><tr><th>节点</th><th>状态</th><th>调用</th></tr>${
      runtime.length ? runtime.map(n=>`<tr><td>${escapeHtml(n.node)}</td><td><span class="st ${n.state === 'healthy' ? 'up' : 'deg'}">${escapeHtml(n.state)}</span></td><td>${n.calls != null ? n.calls : '-'}</td></tr>`).join('')
        : '<tr><td colspan="3">未提供运行时数据</td></tr>'
    }</table></div>
    <div class="card"><div class="k">降级与口径</div>
      <div class="metric"><span>degraded_reasons</span><b>${reasons.length ? escapeHtml(reasons.join('、')) : '无'}</b></div>
      <div class="metric"><span>会话真相来源</span><b style="font-size:12px">${escapeHtml((sessions && sessions.source) || ((sessions && sessions.available) ? 'session-manager' : '未接入'))}</b></div>
      <div class="s" style="white-space:normal;line-height:1.6">${escapeHtml((sessions && (sessions.reason || sessions.note)) || '')}</div>
    </div>
  </div>
  <div class="grid c2">
    ${chartCard('意图分布','doughnut',null,intentDist,'#185fa5')}
    ${chartCard('会话趋势（近7日）','line',['D1','D2','D3','D4','D5','D6','D7'],MOCK.brain.trend,'#185fa5')}
  </div>
  <div class="status-bar"><span>${sessions && sessions.available
    ? '意图分布为<b>真实统计</b>（session-manager Redis SCAN 汇总）；会话趋势仍为<b>演示图表</b>（后端无七日留存统计接口）'
    : '上方两图为<b>演示图表</b>（会话统计不可读，数字非真实指标）'}</span><span>问答链路：<b>${ov.brain_available ? '大脑层在线' : '大脑层离线'}</b></span></div>`;
}

function sensorCard(sensor){
  const cls = sensor.status === 'UP' ? 'up' : (sensor.status === 'DEGRADED' ? 'deg' : 'down');
  const statusText = sensor.status === 'UP' ? 'UP 正常' : (sensor.status === 'DEGRADED' ? 'DEGRADED 降级' : 'DOWN 隔离');
  const warn = sensor.status === 'DEGRADED'
    ? `<div class="sensor-warn">⚠ 降级：${sensor.available ? '上游能力未就绪/探针失败' : '渠道预留未实现'}</div>`
    : (sensor.status === 'DOWN' ? `<div class="sensor-warn">⛔ 已隔离：采集请求自动降级到可用渠道</div>` : '');
  return `
  <div class="sensor ${cls}" data-channel="${sensor.type}" onclick="selectSensor('${sensor.type}')">
    <div class="head"><span class="ico">${sensor.icon || ''}</span><span class="nm">${sensor.name}</span>
      <span class="st ${cls === 'up' ? 'up' : (cls === 'deg' ? 'deg' : 'down')}">${statusText}</span></div>
    <div class="metric"><span>采集批次</span><b>${sensor.collect_count}</b></div>
    <div class="metric"><span>质检通过率</span><b>${sensor.quality_pass_rate}%</b></div>
    <div class="metric"><span>速率</span><b>${sensor.rate_per_minute}/min</b></div>
    <div class="last">最近：${sensor.last_record_text || '暂无记录'}</div>
    ${warn}
  </div>`;
}

async function renderSense(){
  const provider = window.ConsoleDataProvider.source;
  let matrix, stats;
  try{
    [matrix, stats] = await Promise.all([provider.getSenseMatrix(), provider.getSenseStats()]);
  }catch(err){
    return `
    <div class="view-title"><h2>👁️ 感官视图</h2><span class="desc">五感矩阵 · 多渠道采集 · 数据质检</span></div>
    <div class="placeholder">数据源 <b>${window.ConsoleDataProvider.dataSource.toUpperCase()}</b> 加载失败：${err.message}<br><br>
      排查：① 网关已启动（scripts/start.sh java）② DEV_TOKEN_ENDPOINT_ENABLED=true ③ ?ds=mock 回退 Mock</div>`;
  }
  const s = stats.summary || {};
  const trend = (stats.collect_rate_trend || []).map(p=>p.value);
  const labels = (stats.collect_rate_trend || []).map(p=>p.bucket);

 */

/** 一轮问答的会话上下文（多轮对话真相由 session-manager 维护，此处只透传最近 6 轮） */
let chatTurns = [];
/**
 * 真实会话句柄（R4-01）。api 模式下由 session-manager 生成 id 并落 Redis；
 * 不可用时保持 available=false，界面标注「未接入会话链路」，绝不本地拼 id。
 */
let chatSession = { available: false, session_id: '', status: '', reason: '' };

async function ensureChatSession(){
  if (chatSession.available) return chatSession;
  try{
    chatSession = await window.ConsoleDataProvider.source.createSession();
  }catch(e){ chatSession = { available:false, session_id:'', status:'', reason:e.message }; }
  const head = document.querySelector('.chat-head .session-tag');
  if (head) {
    head.textContent = chatSession.available
      ? `会话 ${chatSession.session_id.slice(0, 12)} · ${chatSession.status || 'ACTIVE'}（Redis 持久化）`
      : `未接入会话链路${chatSession.reason ? '：' + chatSession.reason : ''}`;
  }
  return chatSession;
}

function renderAiMessage(res){
  const sources = res.sources || [];
  const gap = res.gap || {};
  const chain = res.chain || [];
  const badges = [];
  if (res.generator === 'mock') badges.push('演示答复 · 未调用大脑层');
  else if (res.degraded) badges.push(`降级生成 · ${res.generator}${res.degraded_reasons && res.degraded_reasons.length ? '（' + res.degraded_reasons.join('、') + '）' : ''}`);
  if (res.cache_hit) badges.push(`语义缓存命中 ${(res.cache_similarity || 0).toFixed(2)}`);

  return `<div class="msg ai">${escapeHtml(res.answer || '')}
    ${badges.length ? `<br><span class="src">🏷 ${escapeHtml(badges.join(' · '))}</span>` : ''}
    ${gap.has_gap ? `<br><span class="src">⚠ 知识库覆盖不足：可用片段 ${gap.usable_chunks != null ? gap.usable_chunks : 0} 条 · 覆盖度 ${Math.round((gap.coverage || 0) * 100)}%</span>` : ''}
    ${sources.length ? `<br><span class="src">📌 来源：${sources.slice(0, 5).map(s => `${escapeHtml(s.title)}${s.score != null ? '（' + Math.round(s.score * 100) + '%）' : ''}`).join(' · ')}</span>` : ''}
    ${chain.length ? `<br><span class="src">🧭 决策链：${chain.map(c => `${escapeHtml(c.step)}${c.latency_ms != null ? ' ' + c.latency_ms + 'ms' : ''}`).join(' → ')}${res.decision_id ? ' · ' + escapeHtml(String(res.decision_id)).slice(0, 12) : ''}</span>` : ''}
    ${(res.compliance || res.attribution || res.confidence != null) ? `<br><span class="src">🛡 合规 ${res.compliance ? escapeHtml(JSON.stringify(res.compliance)) : '-'} · 归因 ${res.attribution ? escapeHtml(JSON.stringify(res.attribution)) : '-'} · 置信 ${res.confidence != null ? res.confidence : '-'}</span>` : ''}
  </div>`;
}

async function sendChat(){
  const input = $('chatInput');
  const text = (input.value || '').trim();
  if (!text) return;
  const body = $('chatBody');
  body.insertAdjacentHTML('beforeend', `<div class="msg user">${escapeHtml(text)}</div>`);
  input.value = '';
  const pendingId = 'msg-' + Date.now();
  body.insertAdjacentHTML('beforeend', `<div class="msg ai" id="${pendingId}">检索与生成中…</div>`);
  body.scrollTop = body.scrollHeight;
  try{
    // 优先走真实会话链路（上下文取 session-manager 的 Redis，重启可恢复）；
    // 会话不可用时退回 /brain/ask，并在徽标上如实标注 session_unavailable。
    const sess = await ensureChatSession();
    let res = sess.available
      ? await window.ConsoleDataProvider.source.askSession(sess.session_id, text)
      : await window.ConsoleDataProvider.source.askBrain(text, CHAT_SESSION, chatTurns.slice(-6));
    if (!res || res.available === false){
      // 会话可能已关闭/过期：重开一次再试，仍失败才报错
      if (sess.available){
        chatSession = { available:false, session_id:'', status:'', reason:'' };
        const retry = await ensureChatSession();
        if (retry.available) res = await window.ConsoleDataProvider.source.askSession(retry.session_id, text);
      }
    }
    if (!res || res.available === false) throw new Error((res && res.reason) || '大脑层不可用');
    if (!sess.available){
      res.degraded = true;
      res.degraded_reasons = Array.from(new Set([...(res.degraded_reasons || []), 'session_unavailable']));
    }
    chatTurns.push({ role: 'user', content: text }, { role: 'assistant', content: res.answer });
    const node = document.getElementById(pendingId);
    if (node) node.outerHTML = renderAiMessage(res); else body.insertAdjacentHTML('beforeend', renderAiMessage(res));
  }catch(err){
    const node = document.getElementById(pendingId);
    const failure = `<div class="msg ai">⚠ 回答失败：${escapeHtml(err.message)}<br><span class="src">未生成任何回答（不伪造回复）。排查：wp-bff 已启动（8090）· nlp-service 已启动（8000）· 或不带参数回退 ?ds=mock</span></div>`;
    if (node) node.outerHTML = failure; else body.insertAdjacentHTML('beforeend', failure);
  }
  body.scrollTop = body.scrollHeight;
}

    body:[{id:'c-检索延迟趋势（近6日）',type:'line',data:MOCK.body.retrieve_trend,labels:['D1','D2','D3','D4','D5','D6'],color:'#7c5cbf'}],
    limb:[{id:'c-DAG执行耗时（P99）',type:'bar',data:MOCK.limb.dag_running?[4.2,6.8,9.5]:[0],labels:['5节点','8节点','12节点'],color:'#c05621'}],
    evolve:[{id:'c-满意度趋势（近6周）',type:'line',data:MOCK.evolve.satisfaction,labels:['W1','W2','W3','W4','W5','W6'],color:'#0f766e'}],
    system:[{id:'c-LLM成本趋势（近6日）',type:'line',data:MOCK.system.cost_trend,labels:['D1','D2','D3','D4','D5','D6'],color:'#5f5e5a'}]
  };
  (specs[name]||[]).forEach(sp=>{
    const el=document.getElementById(sp.id); if(!el)return;
    const isDoughnut=sp.type==='doughnut';
    charts[sp.id]=new Chart(el,{type:sp.type,data:{labels:sp.labels,datasets:[{data:sp.data,label:'',borderColor:sp.color,backgroundColor:sp.colors||(isDoughnut?sp.colors:sp.color+'33'),borderWidth:2,fill:false,tension:.4}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:12}}},scales:isDoughnut?{}:{y:{beginAtZero:true,ticks:{font:{size:10}}},x:{ticks:{font:{size:10}}}}}});
  });
}

// ═══════════ 交互 ═══════════
document.getElementById('nav').addEventListener('click',e=>{
  const item=e.target.closest('.nav-item'); if(item)switchView(item.dataset.view);
});

// ═══════════ 数据源标识（R-C09 Mock / Api 双数据源）═══════════
(function initDataSourceTag(){
  const ds = window.ConsoleDataProvider.dataSource.toUpperCase();
  const tag = document.getElementById('dsTag');
  if(tag){ tag.textContent = `DATA_SOURCE = ${ds}`; tag.className = 'tag ' + (ds === 'API' ? 'api' : 'mock'); }
  const foot = document.getElementById('footDs');
  if(foot) foot.textContent = ds;
})();

const initialView = (location.hash || '#brain').replace('#','');
switchView(views[initialView] ? initialView : 'brain');
</script>
