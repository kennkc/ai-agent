syntax = "proto3";

package common.v1;

option java_multiple_files = true;
option java_package = "com.agent.common.v1";
option go_package = "github.com/agent-lifeform/common/v1";

// 健康检查（所有服务统一实现）
service HealthService {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {
  string service_name = 1;
}

message HealthCheckResponse {
  enum Status {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  Status status = 1;
  string version = 2;
  int64 uptime_seconds = 3;
  map<string, string> dependencies = 4; // 依赖组件健康状态: redis=ok, qdrant=ok
}

// 统一错误结构
message Error {
  string code = 1;      // 业务错误码, 如 AGENT_DUPLICATE
  string message = 2;   // 可读错误信息
  map<string, string> details = 3;
}
