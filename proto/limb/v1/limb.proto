syntax = "proto3";

package limb.v1;

option java_multiple_files = true;
option java_package = "com.agent.limb.v1";

// 四肢层：工具调用与执行
service LimbService {
  // 工具调用
  rpc ExecuteTool(ExecuteToolRequest) returns (ExecuteToolResponse);
  // 工具注册
  rpc RegisterTool(RegisterToolRequest) returns (RegisterToolResponse);
}

message ExecuteToolRequest {
  string tool_name = 1;
  map<string, string> arguments = 2;
  string session_id = 3;
  string tenant_id = 4;
  int32 timeout_ms = 5;
}

message ToolResult {
  bool success = 1;
  string output = 2;
  string error_code = 3;
  int64 execution_time_ms = 4;
  bool sandboxed = 5; // 是否在沙箱内执行
}

message ExecuteToolResponse {
  ToolResult result = 1;
}

message RegisterToolRequest {
  string tool_name = 1;
  string description = 2;
  repeated string required_params = 3;
  bool sandbox_required = 4;
  string tenant_id = 5;
}

message RegisterToolResponse {
  string tool_id = 1;
  bool success = 2;
}
